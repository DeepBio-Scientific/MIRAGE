[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fambench"
version = "0.1.0"
description = "Family-Stratified Protein-Ligand Affinity Benchmark: does your affinity model generalise beyond redundant protein families?"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["binding-affinity", "benchmark", "cofolding", "drug-discovery", "data-leakage"]
authors = [{ name = "FamBench contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "pyarrow>=10",
]

[project.optional-dependencies]
baselines = ["rdkit>=2022.9"]
hub = ["datasets>=2.14", "huggingface_hub>=0.17"]
plots = ["matplotlib>=3.6"]
dev = ["pytest>=7", "ruff>=0.1"]

[project.scripts]
fambench = "fambench.cli:main"

[project.urls]
Homepage = "https://github.com/mrnafold/fambench"
Dataset = "https://huggingface.co/datasets/mrnafold/fambench"

[tool.setuptools]
packages = ["fambench"]

[tool.setuptools.package-data]
fambench = ["../data/*.parquet"]

[tool.ruff]
line-length = 100
